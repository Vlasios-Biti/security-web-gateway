name: Finalize Security Web Gateway v3.7.0

on:
  push:
    branches:
      - release/v3.7.0

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 5dbdb8c7e66d672811437eb7478b04d9ed0727dd
    steps:
      - name: Create v3.7.0 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.7.0" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.7.0' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.7.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.7.0' --notes 'Major product simplification: application-first onboarding, automatic dependency staging, safe application deletion, unified Changes workflow, metadata-only deployment reconciliation, legacy Google Maps/Search category collision fix, Select All discovery review, and a light neutral enterprise UI with consistent favicon/branding. Default-deny enforcement and privileged deployment/rollback remain unchanged.'
          fi