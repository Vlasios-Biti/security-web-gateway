name: Import Security Web Gateway v3.4.0

on:
  push:
    branches:
      - release/v3.4.0

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.4.0
          fetch-depth: 0

      - name: Verify and import v3.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r ' < .import/v340-patch.b64 | base64 -d > /tmp/v340-patch.tar.xz
          echo "7bd3266243e2c43a587dd3b595de4e3aaac629b2578dd9fe5b82dc0f69f9558f  /tmp/v340-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v340-patch.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-v340.yml

          sha256sum -c CHECKSUMS.sha256
          bash -n deploy/*.sh scripts/*.sh
          python3 tests/smoke_v340.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Security Web Gateway v3.4.0"
          git push origin HEAD:release/v3.4.0
