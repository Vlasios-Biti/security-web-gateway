name: Finalize Security Web Gateway v3.4.0

on:
  push:
    branches:
      - release/v3.4.0

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 72ecd2254fb8d42c8fb141e9a4cafe658f2cc0da
    steps:
      - name: Create v3.4.0 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.0" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.4.0' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.4.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.4.0' --notes 'Production release v3.4.0. Adds performance monitoring and caching, optional local Unbound DNS cache, SQLite/WAL tuning, resource prioritization, Policy Simulator, Why Blocked? explainability, application dependency candidates, migration 013, and expanded CI/smoke validation.'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.0" --jq '.object.sha'
          gh release view v3.4.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,targetCommitish