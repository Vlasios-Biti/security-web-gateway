name: Finalize Security Web Gateway v3.5.0

on:
  push:
    branches:
      - release/v3.5.0

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 40da20f0603ea4cbe5f37ee54e511105fa6a7c64
    steps:
      - name: Create v3.5.0 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.0" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.5.0' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.5.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.5.0' --notes 'Human-centered UI/UX redesign: simplified task-oriented navigation, calmer visual hierarchy, role-aware dashboard actions, responsive mobile navigation, dynamic proxy endpoint display, and template CI validation. No enforcement-plane behavior changes from v3.4.5.'
          fi