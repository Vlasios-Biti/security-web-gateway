name: Finalize Security Web Gateway v3.4.1

on:
  push:
    branches:
      - release/v3.4.1

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 66a69df8a718c0072bc81025f7dcd8edc74834ba
    steps:
      - name: Create v3.4.1 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.1" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.4.1' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.4.1 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.4.1' --notes 'Release-integrity hotfix. Fixes CRLF-aware release checksums, makes install health-version validation dynamic, and adds checksum verification to CI. No data-plane, policy-model, schema, or application-intelligence behavior changes from v3.4.0.'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.1" --jq '.object.sha'
          gh release view v3.4.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,targetCommitish