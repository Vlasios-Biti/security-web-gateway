{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h2>Add access</h2><p>Add a website or domain to discover its dependencies. IPs are allowed directly.</p></div><a class="btn ghost" href="/applications">Cancel</a></div>
<section class="form-panel simple-editor">{% if error %}<div class="flash danger-box" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/applications/allow">
<input type="hidden" name="csrf_token" value="{{ request.state.user.csrf_token }}">
<div class="form-grid"><label class="full">Website, domain or IP<input name="destination" value="{{ draft_destination|default('') }}" required autofocus placeholder="https://www.google.com or 203.0.113.10" spellcheck="false"></label><label class="full">Name <span class="optional">optional</span><input name="name" value="{{ draft_name|default('') }}" placeholder="Filled from the website if blank"></label>
{% set allow_unassigned = false %}{% include 'components/access_choice.html' %}</div><div class="form-actions"><button class="btn primary">Add &amp; discover</button></div>
</form></section>{% endblock %}
