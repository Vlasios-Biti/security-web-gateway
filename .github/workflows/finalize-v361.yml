name: Finalize Security Web Gateway v3.6.1

on:
  push:
    branches:
      - release/v3.6.1

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: c6ec6eb09dae21768032fd3c653260fbd7f87e02
    steps:
      - name: Create v3.6.1 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.6.1" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.6.1' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.6.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.6.1 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.6.1' --notes 'Observability-integrity hotfix. Prevents health checks from creating self-generated Squid traffic, excludes appliance self-traffic from normal client analytics by default, and adds an explicit Include system traffic option for troubleshooting. No schema or enforcement-policy changes from v3.6.0.'
          fi