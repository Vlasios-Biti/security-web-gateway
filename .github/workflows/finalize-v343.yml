name: Finalize Security Web Gateway v3.4.3

on:
  push:
    branches:
      - release/v3.4.3

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 01682f72f9c293c4c44c240d176e0bd2171eb444
    steps:
      - name: Create v3.4.3 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.3" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.4.3' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.4.3 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.4.3' --notes 'Versioning/install repair release. Fixes OS VERSION collision, runtime APP_VERSION reporting, and immutable release VERSION metadata. No Squid policy/schema/telemetry behavior changes from v3.4.2.'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.3" --jq '.object.sha'
          gh release view v3.4.3 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,targetCommitish