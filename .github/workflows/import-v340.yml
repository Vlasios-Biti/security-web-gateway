name: Import Security Web Gateway v3.4.0

on:
  push:
    branches:
      - release/v3.4.0

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.4.0
          fetch-depth: 0
      - name: Import and validate package
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r ' < .import/v340-patch.b64 | base64 -d > /tmp/v340-patch.tar.xz
          echo "0e9e1830a3c2a169c86a5141a7ef7139d10b100a70c3bd046c622ccde2e5a7a1  /tmp/v340-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v340-patch.tar.xz -C .
          rm -rf .import

          sha256sum -c CHECKSUMS.sha256
          bash -n deploy/*.sh scripts/*.sh
          python3 tests/smoke_v340.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Security Web Gateway v3.4.0"
          git push origin HEAD:release/v3.4.0
