name: swg-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release checksum manifest
        run: sha256sum -c CHECKSUMS.sha256
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python compile
        run: python -m compileall -q app bin tools privileged tests
      - name: Template syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env=Environment()
          for p in sorted(Path('templates').rglob('*.html')):
              env.parse(p.read_text(encoding='utf-8'))
              print('TEMPLATE OK',p)
          PY
      - name: v3.7 UI contract
        run: |
          grep -q 'ui-v37.css' templates/base.html
          grep -q 'ui-v37.css' templates/login.html
          grep -q 'favicon.svg' templates/base.html
          grep -q 'Add application' templates/applications/discover.html
          grep -q 'Delete application' templates/applications/detail.html
          grep -q 'data-select-candidates-all' templates/applications/discovery_result.html
          grep -q 'data-application-activity' templates/applications/detail.html
          grep -q 'setupApplicationActivityPoll' static/js/app.js
          grep -q 'scope-picker .check' static/css/ui-v37.css
          grep -q 'Activity' templates/base.html
          grep -q 'Approve &amp; apply' templates/deployments/review.html
          grep -q '>Save<' templates/applications/form.html
          grep -q 'def apply_saved_change' app/services/apply.py
          test -s static/css/ui-v37.css
          test -s static/favicon.svg
      - name: v3.9 operations console contract
        run: |
          grep -q 'ui-v39.css' templates/base.html
          grep -q 'Health &amp; performance' templates/base.html
          grep -q 'Storage' templates/base.html
          grep -q 'Administrators' templates/base.html
          grep -q 'Policy &amp; tools' templates/base.html
          grep -q 'system-performance-chart' templates/system/health.html
          grep -q 'TLS certificate' templates/system/health.html
          grep -q 'NTP synchronization' templates/system/health.html
          grep -q 'Recovery posture' templates/system/health.html
          grep -q 'data-live-traffic-refresh' templates/traffic/explorer.html
          grep -q 'setupLiveTrafficRefresh' static/js/app.js
          grep -q 'profile-stats' static/css/ui-v39.css
          grep -q 'system-traffic-filter' static/css/ui-v39.css
          grep -q 'application_count' app/routers/overview.py
          test -s static/css/ui-v39.css
      - name: Application version matches VERSION
        run: |
          python - <<'PY'
          from app.config import APP_VERSION
          expected=open('VERSION', encoding='utf-8').read().strip()
          assert APP_VERSION == expected, (APP_VERSION, expected)
          print(APP_VERSION)
          PY
      - name: Shell syntax
        run: bash -n deploy/*.sh scripts/*.sh
      - name: Background worker direct imports
        env:
          SWG_DB_PATH: /tmp/swg-ci.db
          SWG_DATA_ROOT: /tmp/swg-ci-data
          SWG_MODE: production
          SWG_FQDN: proxy.test.local
          SWG_PROXY_IP: 127.0.0.1
        run: |
          python - <<'PY'
          import runpy
          for path in (
              'bin/collect_performance.py',
              'bin/collect_telemetry.py',
              'bin/process_discovery_queue.py',
              'bin/sync_sources.py',
              'bin/maintain_storage.py',
          ):
              runpy.run_path(path, run_name='swg_ci_import')
              print('IMPORT OK', path)
          PY
      - name: Fresh migration
        run: |
          rm -f /tmp/swg-ci.db
          python tools/migrate.py --db /tmp/swg-ci.db --root .
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/swg-ci.db')
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not list(c.execute('pragma foreign_key_check'))
          assert c.execute('select max(version) from schema_migrations').fetchone()[0]=='015'
          assert c.execute('pragma journal_mode').fetchone()[0].lower()=='wal'
          PY
      - name: v3.3.1 to v3.4 migration
        run: |
          rm -rf /tmp/v331root /tmp/swg-v331.db
          mkdir -p /tmp/v331root/migrations
          cp migrations/0{01,02,03,04,05,06,07,08,09}_*.sql /tmp/v331root/migrations/
          cp migrations/010_*.sql migrations/011_*.sql migrations/012_*.sql /tmp/v331root/migrations/
          python tools/migrate.py --db /tmp/swg-v331.db --root /tmp/v331root
          python tools/migrate.py --db /tmp/swg-v331.db --root .
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/swg-v331.db')
          assert c.execute('select max(version) from schema_migrations').fetchone()[0]=='015'
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not list(c.execute('pragma foreign_key_check'))
          PY
      - name: v3.3 compatibility smoke tests
        run: python tests/smoke_v331.py
      - name: v3.4 performance and intelligence smoke tests
        run: python tests/smoke_v340.py
      - name: v3.7 application workflow smoke tests
        run: python tests/smoke_v370.py
      - name: v3.8 save and apply smoke tests
        run: python tests/smoke_v380.py
      - name: App import
        env:
          SWG_DB_PATH: /tmp/swg-ci.db
          SWG_DATA_ROOT: /tmp/swg-ci-data
          SWG_MODE: production
          SWG_FQDN: proxy.test.local
          SWG_PROXY_IP: 127.0.0.1
        run: python -c 'from app.main import app; print(app.title, len(app.routes))'
      - name: Forbidden product-name scan
        run: |
          forbidden="$(printf '\147\162\157\167\151\156')"
          ! grep -RniI --exclude=CHECKSUMS.sha256 "$forbidden" .
          ! find . -iname "*${forbidden}*" -print | grep .
      - name: Customer-specific example scan
        run: |
          ! grep -RniI -E --exclude=CHECKSUMS.sha256 --exclude-dir=.git '(royalmail|royal mail|growinops)' app templates static docs README.md SECURITY_MODEL.md


  python-314-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python 3.14 compile
        run: python -m compileall -q app bin tools privileged tests
      - name: Python 3.14 app import
        env:
          SWG_DB_PATH: /tmp/swg-py314.db
          SWG_DATA_ROOT: /tmp/swg-py314-data
          SWG_MODE: production
          SWG_FQDN: proxy.test.local
          SWG_PROXY_IP: 127.0.0.1
        run: |
          python tools/migrate.py --db /tmp/swg-py314.db --root .
          python -c 'from app.main import app; print(app.title, len(app.routes))'
      - name: Python 3.14 smoke
        run: |
          python tests/smoke_v340.py
          python tests/smoke_v370.py
          python tests/smoke_v380.py
