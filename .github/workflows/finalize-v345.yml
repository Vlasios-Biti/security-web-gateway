name: Finalize Security Web Gateway v3.4.5

on:
  push:
    branches:
      - release/v3.4.5

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: cff1786405ad68c17bb88f2ce5095d3ff67abc09
    steps:
      - name: Create v3.4.5 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.5" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.4.5' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.4.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.4.5 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.4.5' --notes 'Telemetry cleanup hotfix. Fixes empty/fresh telemetry DB cleanup where after_count was referenced before assignment; adds regression coverage. No Squid policy/schema/UI behavior changes from v3.4.4.'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.4.5" --jq '.object.sha'
          gh release view v3.4.5 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,targetCommitish