{% extends "base.html" %}{% block content %}<div class="page-head"><div><h2>Add Local User</h2><p>Passwords are stored only as Argon2 hashes.</p></div><a class="btn ghost" href="/security/users">Cancel</a></div>
<section class="form-panel">{% if error %}<div class="flash danger-box">{{ error }}</div>{% endif %}<form method="post" action="/security/users/add"><input type="hidden" name="csrf_token" value="{{ request.state.user.csrf_token }}">
<div class="form-grid"><label>Username<input name="username" required></label><label>Role<select name="role"><option>viewer</option><option>operator</option><option>auditor</option><option>admin</option></select></label><label class="full">Password<input type="password" name="password" minlength="14" autocomplete="new-password" required><small>Minimum 14 characters.</small></label></div><button class="btn primary">Create User</button></form></section>{% endblock %}
