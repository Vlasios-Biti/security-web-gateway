name: Finalize Security Web Gateway v3.8.0

on:
  push:
    branches:
      - release/v3.8.0

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 656b6ffb17f8e843e1b92f5ab4bfb8ac1cfbe6ee
    steps:
      - name: Create v3.8.0 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.8.0" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v3.8.0' -f sha="$RELEASE_SHA" >/dev/null
          fi
          if ! gh release view v3.8.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.8.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Security Web Gateway v3.8.0' --notes 'Professional Save & Apply release. Normal Admin Saves now validate and apply policy transactionally with audit and rollback; Operator changes still require Admin approval. Activity replaces routine Deploy workflow. Automatic application discovery applies only after completion. Migration 015, serialized privileged applies, vendor-neutral onboarding examples and customer-specific source guards are included.'
          fi