{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h2>Proxy bypass</h2><p>These destinations always connect directly through the computer's router and DNS.</p></div></div><section class="form-panel simple-editor"><form method="post" action="/connection/bypass"><input type="hidden" name="csrf_token" value="{{ request.state.user.csrf_token }}"><label>Domains, IPs or subnets — one per line<textarea name="bypass" rows="8" placeholder="*.office.internal&#10;192.0.2.25">{{ policy.bypass|join('\n') }}</textarea></label><p class="field-help">Direct traffic is outside proxy filtering and traffic logs.</p><div class="form-actions"><button class="btn primary">Save bypasses</button></div></form></section>{% endblock %}
